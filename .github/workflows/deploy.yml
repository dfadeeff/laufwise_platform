name: Deploy

# Continuous delivery to Railway (PLATFORM_PLAN §6.4). Fires only after CI succeeds on main,
# never on a red build. It is DORMANT until you add the RAILWAY_TOKEN secret and the service
# names — until then the guard step no-ops with a notice, so this workflow is green, not red.
#
# To enable:
#   1. Settings → Secrets and variables → Actions → New secret:  RAILWAY_TOKEN
#   2. New repository variables:  RAILWAY_BACKEND_SERVICE, RAILWAY_FRONTEND_SERVICE
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # allow manual, on-demand deploys

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt an in-flight production deploy

jobs:
  deploy:
    name: deploy to Railway
    runs-on: ubuntu-latest
    # Only on a green CI (or a manual dispatch). A failed CI run never reaches deploy.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BACKEND_SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.RAILWAY_FRONTEND_SERVICE }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${DEPLOY_SHA}" -f branch=main -f event=push -f status=success \
            --jq '.workflow_runs | length')
          if [ "${count}" -eq 0 ]; then
            echo "::error::No successful main CI run for ${DEPLOY_SHA}; refusing deployment."
            exit 1
          fi

      - name: Guard — is CD configured?
        id: guard
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::notice::RAILWAY_TOKEN not set — CD is dormant. Add the secret + service names to enable deploys."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install -g @railway/cli

      - name: Deploy backend
        if: steps.guard.outputs.configured == 'true'
        run: railway up --service "${BACKEND_SERVICE}" --path-as-root backend --ci

      - name: Deploy frontend
        if: steps.guard.outputs.configured == 'true'
        run: railway up --service "${FRONTEND_SERVICE}" --path-as-root frontend --ci
