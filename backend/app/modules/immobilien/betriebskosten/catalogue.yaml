# What a tenant can be charged for, by cost category. The calculator decides nothing about
# allocability itself: it looks the category up here. A new kind of position seen in a real
# Hausgeldabrechnung becomes a new row, not new code.
#
# allocable:
#   true      - a Betriebskost under § 2 BetrKV
#   false     - never passed on; `citation` says why
#   agreement - § 2 Nr. 17 BetrKV "sonstige Betriebskosten": only if the lease names it
# allocable_until: passed on only for billing periods that end on or before this date.
# key: "heizkostenv" routes the position to the heating split; everything else is split by time.
#
# reviewed: false - the citations have not yet been checked by a lawyer. Do not show this
# catalogue to a customer as legal advice until they have.
version: 1
reviewed: false

categories:
