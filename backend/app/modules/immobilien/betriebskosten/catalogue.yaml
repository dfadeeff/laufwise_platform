# Gradtagszahlen in per mille of a heating year, used to split heat consumption over a period
# with no meter reading (§ 9b Abs. 2 HeizkostenV). The commonly used table: June to August share
# 40 between them.
degree_days:
  1: 170
  2: 150
  3: 130
  4: 80
  5: 40
  6: "40/3"
  7: "40/3"
  8: "40/3"
  9: 30
  10: 80
  11: 120
  12: 160
