policy:
  # Below this many hours before the appointment, a cancellation or a move carries the
  # Ausfallhonorar warning (spec §3.7). A number, so the practice can change it.
  short_notice_hours: 24
  # Spec §7: text transcripts live exactly this long inside the protected system, then go.
  transcript_retention_days: 30
  # Spec §4.1. Recorded here so it is an assertion the tests can hold the code to.
  store_audio: false
  # The legal basis recorded on every patient card the agent creates (spec §3.3).
  # PLACEHOLDER: the practice's approved privacy policy does not exist yet. The id is stored
  # verbatim on the card, so whatever replaces this is auditable per patient.
  consent_policy_id: TODO-healthyfeet-muenchen-voice-v1

# Both mailboxes get every summary, without exception (spec §3.9).
notifications:
  recipients:
    - annettedemko@gmail.com
    - muenchen@healthyfeet-podologie.de

# Sentences the practice has approved word for word. The agent reads them rather than composing
# its own: each one is a statement about money or insurance, which is exactly where an
# improvised paraphrase becomes a promise the practice has to honour (spec §5).
phrases:
  muster13: >-
    Mit einer gültigen Heilmittelverordnung Muster 13 kann die Behandlung über die gesetzliche
    Krankenkasse abgerechnet werden. Erwachsene zahlen normalerweise die gesetzliche Zuzahlung
    von zehn Euro je Verordnung plus zehn Prozent der Behandlungskosten, sofern keine
    Zuzahlungsbefreiung vorliegt. Bitte bringen Sie das Originalrezept, Ihre Versichertenkarte
    und gegebenenfalls den Befreiungsnachweis mit.
  privatrezept: >-
    Bei einem Privatrezept bezahlen Sie die Behandlung zunächst selbst in unserer Praxis. Ob und
    in welcher Höhe Ihre Versicherung die Kosten erstattet, klären Sie bitte direkt mit Ihrer
    Versicherung.
  ausfallhonorar: >-
    Da Sie den Termin sehr kurzfristig absagen, kann ein Ausfallhonorar entstehen, falls der
    Termin nicht anderweitig vergeben werden kann. Die Praxis prüft das im Einzelfall.
  offer_reschedule: >-
    Möchten Sie den Termin lieber direkt verschieben, damit Sie keinen neuen Termin separat
    vereinbaren müssen?
  greeting: >-
    Guten Tag, Sie sprechen mit dem digitalen Telefonassistenten der Podologie Healthy Feet
    München. Wie kann ich Ihnen helfen?
