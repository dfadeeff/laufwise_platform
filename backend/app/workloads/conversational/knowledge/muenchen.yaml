# Healthy Feet München — the practice knowledge base.
#
# THE source of truth for everything the agent says about the practice, and deliberately a data
# file rather than prose inside the prompt (spec §5). Prices, opening hours and time windows
# change on the practice's clock, not on ours: a receptionist changing a price should not require
# a prompt review, and a prompt review should not be able to silently change a price.
#
# It is loaded by `app/workloads/conversational/practice.py`, rendered into the agent's
# instructions at call time, AND used by the calendar to build the slot grid — so what the agent
# says and what it can actually book come from the same lines.
#
# `updated` is required: an agent quoting a price has to be quoting a dated one.
updated: 2026-09-05
location_id: muenchen

practice:
  name: Podologie Healthy Feet München
  street: Baumkirchner Straße 19
  postcode: "81673"
  city: München
  phone: "089 4111 5335"
  email: muenchen@healthyfeet-podologie.de
  payment: [Barzahlung, Kartenzahlung]

schedule:
  timezone: Europe/Berlin
  # 0 = Monday. Saturday and Sunday are closed (spec §5).
  open_weekdays: [0, 1, 2, 3, 4]
  # Two periods rather than one span with a break carved out of it: 12:00–13:00 is not a
  # "blocked" hour the grid has to remember to skip, it is simply outside every period, so no
  # code path can ever produce a slot inside it (spec §3.1).
  periods:
    - {from: "09:00", to: "12:00"}
    - {from: "13:00", to: "18:00"}
  # Every appointment the agent creates is 30 minutes, whatever the service (spec §3.1).
  slot_minutes: 30
  # The ONLY calendars the agent may search or book. All three are equivalent — any service may
  # be scheduled in any of them — so the agent never has to choose one.
  resources: [MA1, MA2, MA3]

# Spoken time preferences, resolved to real clock ranges here rather than in the prompt (spec
# §3.1: "These intervals must be stored in configuration, not in the prompt").
# NOTE: the spec names `midday` as a window but never defines its bounds. 11:00–14:00 is our
# reading — the hours either side of the break — and it is here, in one line, to be corrected.
time_windows:
  morning:   {from: "09:00", to: "12:00"}
  midday:    {from: "11:00", to: "14:00"}
  afternoon: {from: "13:00", to: "16:00"}
  evening:   {from: "16:00", to: "18:00"}
  any:       {from: "09:00", to: "18:00"}

# The published private price list (spec §5).
#
# `service_id` is null on every entry and that is not an oversight: these are OUR keys, and the
# spec requires them to be mapped to real thevea service ids and durations before launch. A null
# id is carried through to the booking as "unmapped", which is visible in the run trace — an
# agent booking against a service nobody has mapped is a fact the practice should be able to see.
#
# `agent_bookable: false` means the agent may describe and price it but must NOT book it. Those
# are the ones where booking requires a judgement the spec forbids the agent to make — choosing a
# package size or a brace type (spec §5) — or data the agent is not allowed to ask for: a
# Hausbesuch needs an address, and system rule 10 forbids requesting one.
services:
  - key: medizinische_fusspflege
    name: Medizinische Fußpflege / komplette podologische Behandlung
    price_eur: 69
    duration_minutes: 30
    service_id: null
    agent_bookable: true
    # What the agent books when the caller does not know what they need (spec §4.2 step 3): the
    # exact procedure is decided at the practice, and guessing one is a diagnosis.
    default: true
