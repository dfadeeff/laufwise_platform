# thevea appointment booking — the first REAL connector use case (ADR-0003).
# A governed agent books into a therapist's own thevea calendar: the precondition reads real
# availability, the tool writes via thevea's GraphQL API, and the postcondition RE-QUERIES the
# calendar (a read path independent of the write) — so a booking is accepted only if it actually
# landed, never on the agent's claim.
template: thevea_booking
version: 1
risk: medium
agent_class: conversational

# Config-tier knobs — the Studio auto-renders these into the configuration form.
parameters:
  appointment_type:
    type: enum
    options: [routine, urgent]
    default: routine
    label: Appointment type
  locale:
    type: enum
    options: [de, en]
    default: de

required_connections: [calendar]

# The calendar binding routes to the real thevea provider (RoutingStateProvider dispatches on
# `provider`). Unlike the demo's `provider: memory`, this reads the real system of record; if
# thevea is unreachable the step BLOCKs (STATE_UNAVAILABLE), never falls back to fixture state.
state:
  calendar:
    provider: thevea
    query: availability

steps:
  # Governed action: book only into a genuinely free slot, and accept it only if the calendar
  # confirms afterwards. The requested window (date/type) is supplied per run in the case and
  # flows to the provider + tool at dispatch time (connector wiring step).
  - id: book_slot
    kind: enforced
    tools: [book_appointment]
    preconditions:
      - check: calendar.has_free_slot == true
        else: "the requested time is not free in the thevea calendar"
    approval:
      required_when: "type == 'urgent'"
      prompt: "Urgent booking — confirm before reserving the slot."
    execute:
      adapter: registry
      tool: book_appointment
    postconditions:
      - check: calendar.slot_booked == true
        else: "thevea did not record the booking (write claimed success but state disagrees)"