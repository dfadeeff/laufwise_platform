key: betriebskosten
version: 4
label: Betriebskostenabrechnung
summary: >-
  Die jährliche Abrechnung einer vermieteten Eigentumswohnung: aus Hausgeldabrechnung,
  Grundsteuer, Heizkosten und Mietvertrag, jede Zahl mit Fundstelle.
# The functions the platform calls, each in its own sandbox call (ADR-0039 D3).
functions: [compute, check, letters]
rules: {file: rules/catalogue.yaml, name: catalogue}
# An open item holds the case at `messdienst` while the letters for what stands go out; once
# the Messdienst's figure is in the input, the settlement is computed again (ADR-0039 D3).
procedure:
  - {id: compute, kind: function, function: compute}
  - {id: check, kind: check, function: check, of: compute}
  - {id: letters, kind: letters, function: letters, of: compute}
  - {id: messdienst, kind: wait, of: compute, resume: compute}
