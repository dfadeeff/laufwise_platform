[project]
name = "laufwise-platform-backend"
version = "0.1.0"
description = "Governed agent runtime — control plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",  # verify Clerk session JWTs (RS256 via JWKS) — org = tenant, ADR-0003
    # Persistence stack (ADR-0001): async SQLAlchemy + asyncpg + Alembic on Supabase Postgres.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Connectors (ADR-0003): httpx for the thevea GraphQL client; cryptography for Fernet
    # credential encryption (cryptography also arrives via pyjwt[crypto]; declared here because
    # we use Fernet directly).
    "httpx>=0.27",
    "cryptography>=42",
    # Headless-browser login for doctolib Pro: its Keycloak login is gated by friendlyCaptcha (a
    # browser-run proof-of-work), so a raw HTTP POST is rejected — Playwright drives a real
    # headless Chromium to log in. Verified to pass from Railway's datacenter IP (Option A1).
    "playwright>=1.40",
    # Conversational surface: Pipecat owns the real-time media loop. Provider extras are kept
    # explicit so the control-plane image contains exactly the services selected for v1.
    "pipecat-ai[deepgram,elevenlabs,openai,silero,websocket]>=1.3,<2",
    # The control plane primitive. During local dev, install the sibling repo editable:
    #   pip install -e ../../laufwise
    # Pinned here once published:
    # "laufwise>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",        # FastAPI TestClient
    "ruff>=0.7,<0.17",   # upper bound: a ruff minor may change rule behaviour under us (0.16 did)
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# State the rule set explicitly. Without a `select`, the contract is "whatever ruff ships as its
# default today" — and since the dev extra floats (`ruff>=…`), CI installs the newest release on
# every run. ruff 0.16 widened those defaults and turned untouched backend code into 88 findings
# and a red CI. These four ARE ruff's historical defaults: this is the rule set the repo has been
# passing all along, now written down instead of inherited.
# Widening the set (bugbear, isort, pyupgrade, …) is a real option, but it is a deliberate
# ~88-finding cleanup — and B008 would need `extend-immutable-calls` for FastAPI's Depends.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
